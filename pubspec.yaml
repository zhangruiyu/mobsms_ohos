name: mobsms_ohos
description: HarmonyOS implementation of the MobTech mobsms Flutter plugin.
version: 0.2.0
repository: https://github.com/zhangruiyu/mobsms_ohos
issue_tracker: https://github.com/zhangruiyu/mobsms_ohos/issues

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  mobsms: ^1.2.1

flutter:
  plugin:
    implements: mobsms
    platforms:
      ohos:
        package: mobsms_ohos
        pluginClass: MobsmsOhosPlugin
